<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <section class="checkout">
        <div class="left-side">
            <h1>Package Name</h1>
            <label>Branch:</label>
            <select>
                <option>Select Branch</option>
            </select>
            <label>Time:</label>
            <select>
                <option>Select Time</option>
            </select>
            <div class="row">
                <div class="input-box">
                    <label>Package Name:</label>
                    <select>
                        <option>Select Package</option>
                    </select>
                </div>
                <div class="input-box">
                    <label>Membership:</label>
                    <select>
                        <option>Select Duration</option>
                    </select>
                </div>
            </div>
            <button class="find-btn">Find</button>
        </div>

        <div class="right-side">
            <h2>2 Gents (Buddy Offer)</h2>
            <div class="summary">
                <div class="details">
                    <h3>2 Gents (Buddy Offer)</h3>
                    <p>MOORS SPORTS CLUB</p>
                    <p>Full Time</p>
                    <p>Annual</p>
                </div>
                <div class="price">
                    <span>1 X</span>
                    <h3>Rs.45000</h3>
                </div>
            </div>
            <div class="promo">
                Promotion Code here!
            </div>
            <div class="total">
                <h3>Total</h3>
                <h3>Rs.45000</h3>
            </div>
            <div class="contact">
                <h2>Contact</h2>
                <input type="email" placeholder="Email">
                <input type="text" placeholder="Phone Number">
                <div class="row">
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                </div>
                <input type="text" placeholder="Address">
            </div>
        </div>
    </section>
</body>

</html>
